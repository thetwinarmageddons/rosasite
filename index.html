    <link rel="icon" type="image/png" href="assets/squiddle.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url('assets/Nightcore.jpg'); 
            background-color: #111;
            background-size: cover;
            background-attachment: fixed;
            color: #b536da;
            font-family: "Courier New", courier;
            margin: 0;
            padding: 30px; 
            box-sizing: border-box;
            min-height: 100vh;
            
            display: flex;
            justify-content: flex-end; 
            align-items: flex-start;
        }

        .main-container {
            width: 100%;
            max-width: 450px;
            background-color: rgba(0, 0, 0, 0.85); 
            border: 3px solid #520c61;
            border-radius: 20px; 
            padding: 20px;
            
            display: flex;
            flex-direction: row;
            gap: 20px; 
        }

        .content-column {
            flex-grow: 1;
            display: flex;
            flex-direction: row; 
            gap: 15px;
            align-items: flex-start; 
        }

        .icon-box {
            width: 100px;
            flex-shrink: 0; 
            display: flex;
            justify-content: center;
        }

        .text-box h1 {
            margin-top: 0;
            font-size: 1em; 
        }

        @keyframes stampScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } 
        }

        .inner-stamp-box {
            width: 160px; 
            height: 400px; 
            overflow: hidden;
            position: relative;
            border: 3px solid #9c4dad;
            border-radius: 10px; 
            flex-shrink: 0; 
        }

        .stamp-track {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            animation: stampScroll 30s linear infinite; 
        }
        
        .stamp-track:hover { animation-play-state: paused; }
        
        .stamp-track img {
            max-width: 140px; 
            height: auto;     
            display: block;
            image-rendering: pixelated; 
        }
    </style>
</head>
